<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام متابعة الطلاب</title>
    <style>
        body { font-family: 'Tahoma', sans-serif; background: #f0f4f8; margin: 0; padding: 20px; }
       .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; }
       .form-group { margin-bottom: 15px; }
        input, button { padding: 10px; border-radius: 8px; border: 1px solid #ddd; font-size: 16px; }
        button { background: #3498db; color: white; border: none; cursor: pointer; margin: 5px; }
        button:hover { background: #2980b9; }
        button.danger { background: #e74c3c; }
        button.success { background: #2ecc71; }
        button.warning { background: #f39c12; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background: #3498db; color: white; }
       .absent { background: #fdecea; }
    </style>
</head>
<body>
<div class="container">
    <h1>نظام متابعة الطلاب 📚</h1>

    <div id="form">
        <h3 id="formTitle">اضافة طالب جديد</h3>
        <input type="hidden" id="editIndex">
        <div class="form-group">
            <input type="text" id="name" placeholder="اسم الطالب">
            <input type="text" id="code" placeholder="كود الطالب">
            <input type="text" id="parent" placeholder="رقم ولي الامر">
            <input type="number" id="grade" placeholder="الدرجة">
        </div>
        <button onclick="saveStudent()">حفظ</button>
        <button onclick="cancelEdit()" id="cancelBtn" style="display:none;">الغاء</button>
    </div>

    <input type="text" id="search" placeholder="ابحث باسم الطالب..." onkeyup="displayStudents()" style="width:100%; margin-top:20px;">

    <table>
        <thead>
            <tr>
                <th>الاسم</th><th>الكود</th><th>رقم ولي الامر</th><th>الدرجة</th><th>الحالة</th><th>الاجراءات</th>
            </tr>
        </thead>
        <tbody id="studentsTable"></tbody>
    </table>
</div>

<script>
let students = JSON.parse(localStorage.getItem('students')) || [];

function saveStudent() {
    let name = document.getElementById('name').value;
    let code = document.getElementById('code').value;
    let parent = document.getElementById('parent').value;
    let grade = document.getElementById('grade').value;
    let index = document.getElementById('editIndex').value;

    if(!name ||!code) { alert('دخلي الاسم والكود'); return; }

    let student = {name, code, parent, grade, status: 'حاضر'};

    if(index === '') {
        students.push(student);
    } else {
        student.status = students[index].status; // احتفظ بالحالة القديمة
        students[index] = student;
    }

    localStorage.setItem('students', JSON.stringify(students));
    clearForm();
    displayStudents();
}

function editStudent(i) {
    let s = students[i];
    document.getElementById('name').value = s.name;
    document.getElementById('code').value = s.code;
    document.getElementById('parent').value = s.parent;
    document.getElementById('grade').value = s.grade;
    document.getElementById('editIndex').value = i;
    document.getElementById('formTitle').innerText = 'تعديل بيانات الطالب';
    document.getElementById('cancelBtn').style.display = 'inline-block';
}

function cancelEdit() {
    clearForm();
}

function clearForm() {
    document.getElementById('name').value = '';
    document.getElementById('code').value = '';
    document.getElementById('parent').value = '';
    document.getElementById('grade').value = '';
    document.getElementById('editIndex').value = '';
    document.getElementById('formTitle').innerText = 'اضافة طالب جديد';
    document.getElementById('cancelBtn').style.display = 'none';
}

function deleteStudent(i) {
    if(confirm('متأكدة عايزة تمسحي الطالب؟')) {
        students.splice(i, 1);
        localStorage.setItem('students', JSON.stringify(students));
        displayStudents();
    }
}

function toggleAbsence(i) {
    students[i].status = students[i].status === 'حاضر'? 'غايب' : 'حاضر';
    localStorage.setItem('students', JSON.stringify(students));
    displayStudents();
}

function displayStudents() {
    let search = document.getElementById('search').value.toLowerCase();
    let tbody = document.getElementById('studentsTable');
    tbody.innerHTML = '';
    students.filter(s => s.name.toLowerCase().includes(search)).forEach((s, i) => {
        tbody.innerHTML += `
        <tr class="${s.status === 'غايب'? 'absent' : ''}">
            <td>${s.name}</td>
            <td>${s.code}</td>
            <td>${s.parent}</td>
            <td>${s.grade}</td>
            <td>${s.status}</td>
            <td>
                <button class="warning" onclick="editStudent(${i})">تعديل</button>
                <button class="success" onclick="toggleAbsence(${i})">غياب/حضور</button>
                <button class="danger" onclick="deleteStudent(${i})">مسح</button>
            </td>
        </tr>`;
    });
}

displayStudents();
</script>
</body>
</html>

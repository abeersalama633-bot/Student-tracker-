<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>نظام متابعة الطلاب</title>
<style>
    body { font-family: 'Tahoma', sans-serif; background: #f4f4f4; padding: 20px; }
   .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px #ccc; }
    h1 { text-align: center; color: #2c3e50; }
    input, button { padding: 8px; margin: 5px; border-radius: 5px; border: 1px solid #ddd; }
    button { background: #3498db; color: white; cursor: pointer; border: none; }
    button:hover { background: #2980b9; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
    th { background: #3498db; color: white; }
   .present { color: green; font-weight: bold; }
   .absent { color: red; font-weight: bold; }
    @media print {.no-print { display: none; } }
</style>
</head>
<body>
<div class="container">
    <h1>نظام متابعة الطلاب</h1>

    <div class="no-print">
        <input type="text" id="name" placeholder="اسم الطالب">
        <input type="text" id="parent" placeholder="رقم ولي الامر">
        <button onclick="addStudent()">اضافة طالب</button>
        <button onclick="exportCSV()">تصدير اكسل</button>
        <button onclick="window.print()">🖨️ طباعة الكشف</button>
        <input type="text" id="search" placeholder="بحث عن طالب" onkeyup="searchStudent()">
    </div>

    <table id="studentsTable">
        <thead>
            <tr>
                <th>م</th>
                <th>اسم الطالب</th>
                <th>رقم ولي الامر</th>
                <th>الحالة</th>
                <th class="no-print">تحكم</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script>
let students = JSON.parse(localStorage.getItem('students')) || [];

function displayStudents(list = students) {
    let tbody = document.querySelector('#studentsTable tbody');
    tbody.innerHTML = '';
    list.forEach((s, i) => {
        let statusClass = s.status === 'حاضر'? 'present' : 'absent';
        tbody.innerHTML += `
        <tr>
            <td>${i+1}</td>
            <td>${s.name}</td>
            <td>${s.parent}</td>
            <td class="${statusClass}">${s.status}</td>
            <td class="no-print">
                <button onclick="toggleAbsence(${i})">تغيير الحالة</button>
                <button onclick="deleteStudent(${i})" style="background:red">حذف</button>
            </td>
        </tr>`;
    });
}

function addStudent() {
    let name = document.getElementById('name').value;
    let parent = document.getElementById('parent').value;
    if(name && parent) {
        students.push({name, parent, status: 'حاضر'});
        localStorage.setItem('students', JSON.stringify(students));
        displayStudents();
        document.getElementById('name').value = '';
        document.getElementById('parent').value = '';
    }
}

function toggleAbsence(i) {
    students[i].status = students[i].status === 'حاضر'? 'غايب' : 'حاضر';
    if(students[i].status === 'غايب' && students[i].parent) {
        let msg = `عزيزي ولي امر الطالب ${students[i].name} نود اعلامكم بغياب ابنكم اليوم`;
        window.open(`https://wa.me/${students[i].parent}?text=${encodeURIComponent(msg)}`, '_blank');
    }
    localStorage.setItem('students', JSON.stringify(students));
    displayStudents();
}

function deleteStudent(i) {
    if(confirm('متاكد من الحذف؟')) {
        students.splice(i, 1);
        localStorage.setItem('students', JSON.stringify(students));
        displayStudents();
    }
}

function searchStudent() {
    let val = document.getElementById('search').value;
    let filtered = students.filter(s => s.name.includes(val));
    displayStudents(filtered);
}

function exportCSV() {
    let csv = 'م,اسم الطالب,رقم ولي الامر,الحالة\n';
    students.forEach((s, i) => {
        csv += `${i+1},${s.name},${s.parent},${s.status}\n`;
    });
    let blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    let link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'كشف_الطلاب.csv';
    link.click();
}

displayStudents();
</script>
</body>
</html>

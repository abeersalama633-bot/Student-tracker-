<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام متابعة الطلاب</title>
<style>
    body { font-family: 'Tahoma'; background: #f4f6f9; padding: 20px; margin: 0; }
    .container { max-width: 1100px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 10px #ccc; }
    h1 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
    .top-btns { text-align: center; margin: 15px 0; }
    .btn { padding: 10px 20px; margin: 5px; border: none; border-radius: 6px; cursor: pointer; color: white; font-weight: bold; font-size: 16px; }
    .btn-excel { background: #27ae60; }
    .btn-print { background: #8e44ad; }
    .btn-save { background: #3498db; }
    .add-box { margin:15px 0; padding:15px; background:#ecf0f1; border-radius:8px }
    .add-box h3 { margin-top: 0; color: #2c3e50; }
    .add-box input { padding: 10px; margin: 5px 1%; border: 1px solid #ddd; border-radius: 5px; width: 22%; box-sizing: border-box; }
    .btn-add { background:#27ae60; width:100%; margin-top:10px }
    #search { padding: 10px; margin: 5px; border: 1px solid #ddd; border-radius: 5px; float:left; width:250px }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; clear:both }
    th { background: #3498db; color: white; padding: 12px; text-align: center; }
    td { border: 1px solid #ddd; padding: 10px; text-align: center; }
    .btn-edit { background: #f39c12; padding: 6px 12px; }
    .btn-toggle { background: #2ecc71; padding: 6px 12px; }
    .btn-delete { background: #e74c3c; padding: 6px 12px; }
    .حاضر { color: green; font-weight: bold; }
    .غايب { color: red; font-weight: bold; }
</style>
</head>
<body>
<div class="container">
    <h1>نظام متابعة الطلاب</h1>
    
    <div class="top-btns">
        <button class="btn btn-excel" onclick="exportCSV()">تصدير اكسل 📊</button>
        <button class="btn btn-print" onclick="window.print()">طباعة الكشف 🖨️</button>
        <button class="btn btn-save" onclick="saveData()">حفظ</button>
    </div>

    <div class="add-box">
        <h3>اضافة طالب جديد</h3>
        <input id="name" placeholder="اسم الطالب">
        <input id="code" placeholder="الكود">
        <input id="parent" placeholder="رقم ولي الامر بدون 0">
        <input id="grade" placeholder="الدرجة">
        <button class="btn btn-add" onclick="addStudent()">اضافة طالب</button>
    </div>

    <input id="search" placeholder="ابحث باسم الطالب..." onkeyup="displayStudents()">
    
    <table>
        <thead>
            <tr>
                <th>الاسم</th><th>الكود</th><th>رقم ولي الامر</th><th>الدرجة</th><th>الحالة</th><th>الاجراءات</th>
            </tr>
        </thead>
        <tbody id="studentsTable"></tbody>
    </table>
</div>

<script>
let students = JSON.parse(localStorage.getItem('students')) || [];

function getStatusText(s){
    if(s === 'present' || s === 'حاضر') return 'حاضر';
    if(s === 'absent' || s === 'غايب') return 'غايب';
    return 'حاضر';
}

function displayStudents(){
    let search = document.getElementById('search').value;
    let tbody = document.getElementById('studentsTable');
    tbody.innerHTML = '';
    students.filter(s=>s.name.includes(search)).forEach((s,i)=>{
        let status = getStatusText(s.status);
        tbody.innerHTML += `<tr>
            <td>${s.name}</td>
            <td>${s.code}</td>
            <td>${s.parent}</td>
            <td>${s.grade}</td>
            <td class="${status}">${status}</td>
            <td>
                <button class="btn-edit" onclick="editStudent(${i})">تعديل</button>
                <button class="btn-toggle" onclick="toggleAbsence(${i})">غياب/حضور</button>
                <button class="btn-delete" onclick="deleteStudent(${i})">مسح</button>
            </td>
        </tr>`;
    });
}

function addStudent(){
    let n=document.getElementById('name').value;
    let c=document.getElementById('code').value;
    let p=document.getElementById('parent').value;
    let g=document.getElementById('grade').value;
    if(!n || !p) return alert('لازم تكتبي الاسم ورقم ولي الامر');
    
    students.push({name:n, code:c, parent:p, grade:g, status:'حاضر'});
    saveData();
    displayStudents();
    document.getElementById('name').value='';
    document.getElementById('code').value='';
    document.getElementById('parent').value='';
    document.getElementById('grade').value='';
}

function toggleAbsence(i){
    let current = getStatusText(students[i].status);
    students[i].status = current === 'حاضر'? 'غايب' : 'حاضر';
    
    if(students[i].status === 'غايب' && students[i].parent){
        let today = new Date().toLocaleDateString('ar-EG');
        let msg = `السيد ولي امر الطالب/ ${students[i].name}\nنحيط علم سيادتكم بغياب ابنكم/ابنتكم اليوم ${today}\nبرجاء التكرم بالمتابعة.\nادارة المدرسة`;
        window.open(`https://wa.me/2${students[i].parent}?text=${encodeURIComponent(msg)}`,'_blank');
    }
    saveData();
    displayStudents();
}

function deleteStudent(i){if(confirm('متأكدة انك عايزة تمسحي الطالب؟')){students.splice(i,1);saveData();displayStudents();}}
function editStudent(i){alert('ميزة التعديل هنضيفها بعدين ان شاء الله')}
function saveData(){localStorage.setItem('students',JSON.stringify(students));alert('تم حفظ البيانات بنجاح')}
function exportCSV(){
    let csv = 'الاسم,الكود,رقم ولي الامر,الدرجة,الحالة\n' + students.map(s=>`${s.name},${s.code},${s.parent},${s.grade},${getStatusText(s.status)}`).join('\n');
    let blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8;'});
    let a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'كشف_الطلاب.csv'; a.click();
}
displayStudents();
</script>
</body>
</html>
